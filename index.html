<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myagent</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="stage">
      <div id="chat" class="hidden" aria-hidden="true">
        <div id="chat-log"></div>
        <form id="chat-form">
          <input
            id="chat-input"
            type="text"
            maxlength="120"
            placeholder="say something…"
            autocomplete="off"
            spellcheck="false"
          />
        </form>
        <p id="chat-hint">esc closes · click cat to pet</p>
      </div>
      <canvas id="cat" width="128" height="128" aria-label="Desktop cat"></canvas>
      <div id="pet-fx" aria-hidden="true"></div>
    </div>
  </body>
</html>
